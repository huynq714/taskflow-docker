services:
  taskflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskflow:local
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DATABASE_PATH: /app/data/tasks.db
    volumes:
      - taskflow_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    pids_limit: 128
    mem_limit: 256m

volumes:
  taskflow_data:
