name: CD - Publish TaskFlow image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Test and publish GHCR image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test
        run: |
          python -m pip install -r requirements.txt
          python tests_smoke.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: taskflow:candidate
      - name: Scan candidate for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskflow:candidate
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image owner
        id: image
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${REPOSITORY_OWNER,,}/taskflow" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

