name: CI - TaskFlow

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app.py tests_smoke.py
      - name: Run API smoke tests
        run: python tests_smoke.py

  docker:
    name: Docker build and scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no publishing)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: taskflow:ci
      - name: Scan high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: taskflow:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
